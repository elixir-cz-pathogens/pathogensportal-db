# Registry of methodology changes in the source systems.
#
# Why it exists: a change in the way cases are reported looks exactly like an
# epidemic in the data, and without this knowledge the detector reports it as
# an outbreak. One such false detection discredits the tool with
# epidemiologists for good — so the registry is a BLOCKING part of the system,
# not a documentation aid.
#
# The keys and the enum values are Czech because the code reads them by name
# (detect_anomalies.py, source_metadata.py); the free-text values are Czech
# because they are copied into the generated JSON (signal annotations, chart
# `caveats`). Translating either changes the pipeline's output, not just the
# wording of this file.
#
# Record format:
#   id:      stable identifier
#   od:      ("from") YYYY-MM, when the change took effect
#   do:      ("until") YYYY-MM or null (the change is still in effect)
#   akce:    ("action")
#            break    – history BEFORE the change date is not used as a baseline
#                       for the affected series (the level of the series has
#                       changed); until enough new history accumulates the
#                       series is not scored and is reported as "re-baselining"
#            exclude  – the od–do period is cut out of the baseline (a temporary
#                       distortion, e.g. a reporting outage); the series is
#                       otherwise scored normally
#            flag     – nothing changes, signals nearby just carry a warning
#            poznamka – ("note") informational record with no effect on the
#                       computation
#   rozsah:  ("scope")
#            diagnozy: [exact ISIN diagnosis names] or null = all
#            kraje:    [NUTS3 region codes] or null = all
#   zdroj:   ("source") how we know about the change (document, meeting, our
#            own measurement)
#   popis:   ("description") what happened
#   dopad:   ("impact") expected direction and size of the effect on the counts

- id: zoster-vykazovani-2025-07
  od: 2025-07
  do: null
  akce: break
  rozsah:
    diagnozy: ["Pásový opar [herpes zoster]"]
    kraje: null
  zdroj: "vlastní měření detektoru (09/2026); příčina doložena sloupcem EWS ve zdrojových datech ÚZIS"
  popis: >-
    Skoková změna úrovně vykazování pásového oparu: měsíční počty vzrostly
    z ~330 na 860–1 260, ve všech krajích současně a trvale. Příčinou je nový
    kanál hlášení EWS, kterým od 7/2025 přichází 62 % případů; bez nich řada
    neroste, naopak klesá (340 → 175), protože se do EWS část hlášení přelila.
    Tentýž kanál zasahuje i další diagnózy — obecně ho řeší channel_verdict()
    v detect_anomalies.py, tenhle záznam zůstává pro nejsilněji postiženou řadu.
  dopad: "~3× vyšší hlášené počty od 7/2025; stará baseline je pro novou úroveň nepoužitelná"

