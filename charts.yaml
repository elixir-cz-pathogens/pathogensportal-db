# What each chart measures — a map chart JSON → source, metric, unit, grain.
#
# Why it exists: a generated chart JSON is just `labels` + `datasets`, i.e. bare
# numbers with Czech labels. A person reads what they are looking at from the
# page heading; a machine cannot. The AI layer on top of the portal, which is
# supposed to answer "how many cases were there", has to know the metric, the
# UNIT (a count and a rate per 100,000 are two different numbers) and the
# period grain of every series — otherwise it will confidently add up
# percentages or compare months with years. This file supplies that without
# touching thirty generator functions.
#
# `save()` in generate_json.py looks a chart up here by name and writes the
# result into the `meta` block. A chart without a record is detected (a warning
# during generation + the test in test_source_metadata.py), so the map cannot
# quietly fall behind the code.
#
# Keys:
#   source   id from sources.yaml; a list when the chart combines several
#            sources (typically counts + ČSÚ population for the per-100,000 rate)
#   metric   cases | deaths | tests | hospitalizations | lab_detections
#            | positivity | case_fatality | hospitalization_rate | forecast
#            | intensity_threshold | anomaly_score — the same vocabulary as
#            `metric` in the observation table (db/init.sql), so it joins with
#            the database
#   unit     count | per_100k | percent | score — the MACHINE unit.
#            Charts carry their own human-readable label in `unit`/`x_title`.
#   grain    grain of the X axis: day | week | month | year | age_group | region
#            | vaccination_status | cumulative | season_week
#            (season_week = week of the surveillance season, one series per
#            season — the axis is not a timeline, so no period is read from it)
#   region   CZ = the whole country as one number; NUTS3 = broken down by region
#
# The `isin_group_*` entry applies to every chart with that prefix (the thematic
# disease groups are generated dynamically from the data).

covid_cases_weekly:      { source: mzcr-covid, metric: cases, unit: count, grain: week, region: CZ }
