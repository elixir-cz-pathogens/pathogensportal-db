# Patogeny, pro které se sleduje, co je z Česka veřejně v genomických archivech.
#
# Proč ručně vedený seznam, a ne „co je v archivu nejčastější“: značka `pathogen`
# v ENA je velmi široká — patří do ní i viry rostlin (šarka švestky) a zvířat
# (prasečí PRRS) nebo bakteriofágy. Žebříček podle počtu by tedy vedl čtenáře
# pryč od nemocí, o kterých portál píše. Seznam proto drží tytéž nemoci, které
# má portál v ostatních panelech, a archiv se dotazuje na ně.
#
# Pole:
#   id       stabilní klíč do výstupního JSON (ne taxon — ten se může změnit)
#   taxon    tax_id v NCBI taxonomii; dotaz používá tax_tree(), tedy včetně
#            podřízených taxonů (např. 11320 = Influenza A virus pokrývá všechny
#            subtypy, 77643 = komplex M. tuberculosis pokrývá M. bovis i další)
#   name     název pro čtenáře, cs/en
#   latin    vědecký název, kurzívou v tabulce; u virů bez kurzívy, proto `italic`
#   group    skupina v tabulce (klíč do GROUPS v compute_genomics.py)
#   page     stránka portálu o téže nemoci; null = portál o ní zatím nemá panel
#
# Pořadí uvnitř skupiny = pořadí v tabulce; skupiny řadí compute_genomics.py.

- id: tuberculosis
  taxon: 77643
  name: { cs: "Tuberkulóza", en: "Tuberculosis" }
  latin: "Mycobacterium tuberculosis complex"
  italic: true
  group: respiratory
  page: /dashboards/infectious-diseases-tbc/

