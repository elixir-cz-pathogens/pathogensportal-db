# Pathogen registry — the reference list behind the portal's "information database".
#
# Why it exists: the portal names the same pathogen in several places (the
# genomic table, the disease groups, dashboard titles, the page text), each
# with its own wording and none with an identifier a machine could join on.
# This file is the one place that says, for every pathogen the portal covers:
# what it is called in Czech and in English, how the authorities identify it,
# under which ICD-10 codes its disease appears in the data, and on which
# dashboards a reader finds it. scripts/load_pathogens.py loads it into
# PostgreSQL (tables in db/init.sql, described in docs/pathogen-registry.md).
#
# The file is the source of truth; the database is a copy that can be rebuilt
# at any time. Edit here, never in the database.
#
# ── Where each value comes from ──────────────────────────────────────────────
#   taxon, scientific_name, rank, species, family
#             NCBI Taxonomy as served by ENA (EMBL-EBI):
#             https://www.ebi.ac.uk/ena/taxonomy/rest/tax-id/<taxon>
#             ENA, NCBI and UniProt share the identifier. scientific_name is
#             the name of that node, letter for letter; species is the ICTV
#             binomial of the species the node belongs to (viruses whose
#             commonly used node sits below the species); family is taken
#             from the lineage. scripts/verify_pathogens.py re-checks all of
#             them against ENA.
#   ids.wikidata  the Wikidata item whose "NCBI taxonomy ID" (P685) equals taxon
#   ids.mesh      the MeSH descriptor stated by that Wikidata item (P486); each
#                 was checked against id.nlm.nih.gov on the `verified` day.
#                 A pathogen without a matching Wikidata item has no `ids` —
#                 a gap is better than a guessed identifier.
#   icd10         ICD-10 codes (WHO ICD-10 Version 2019 = the Czech MKN-10)
#                 that mean this pathogen's disease and nothing else
#   icd10_shared  codes whose heading covers this pathogen AND others (A04
#                 "other bacterial intestinal infections" is Campylobacter and
#                 more). Counts under a shared code must never be attributed
#                 to one pathogen — the same rule as in diagnosis_names.yaml.
#   name, disease, synonyms, abbreviations
#             the portal's own reader-facing wording, Czech and English. For
#             the pathogens of the genomic table the disease name is the one
#             that table shows. The OFFICIAL disease titles are not repeated
#             here: they are looked up by ICD-10 code in curated/labels_en.yaml
#             (Czech: MKN-10 as published by ÚZIS, English: WHO ICD-10 2019).
#   dashboards    portal pages that show this pathogen (paths of the Czech
#                 site; the English page is the same path under /en)
#   verified      the day somebody last checked the record against the
#                 sources above
#
# ── Record format ────────────────────────────────────────────────────────────
#   id        stable key. A pathogen that is also in curated/genomics_taxa.yaml
#             or was seeded in db/init.sql keeps the id it has there (which is
#             why some ids are disease words: tuberculosis, syphilis).
#   category  virus | bacteria | fungus | parasite | other
#   parent    id of the pathogen this one is a subtype or member of (optional)
#   taxon_note  why the taxon is not an exact match (optional)
#
# Adding a pathogen: docs/pathogen-registry.md#adding-a-pathogen.

# Identifier schemes. `uri` is the pattern of the public page of one record.
# ncbi-taxon and ena-taxon are both filled from `taxon`.
schemes:
  ncbi-taxon:
    title: "NCBI Taxonomy"
    authority: "National Center for Biotechnology Information (NCBI)"
    homepage: "https://www.ncbi.nlm.nih.gov/taxonomy"
    uri: "https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id={id}"
  ena-taxon:
    title: "ENA Taxonomy"
    authority: "European Nucleotide Archive, EMBL-EBI"
    homepage: "https://www.ebi.ac.uk/ena/browser/"
    uri: "https://www.ebi.ac.uk/ena/browser/view/Taxon:{id}"
  wikidata:
    title: "Wikidata"
    authority: "Wikimedia Foundation"
    homepage: "https://www.wikidata.org/"
    uri: "https://www.wikidata.org/entity/{id}"
  mesh:
    title: "Medical Subject Headings (MeSH)"
    authority: "U.S. National Library of Medicine (NLM)"
    homepage: "https://meshb.nlm.nih.gov/"
    uri: "https://id.nlm.nih.gov/mesh/{id}"

# Portal pages a pathogen can be linked to.
#   kind   surveillance = case counts or laboratory detections
#          genomics     = what is in the sequence archives
#          report       = situational report written for one event
#          external     = the tile leads to a dashboard run elsewhere
#   chart  the chart JSON that carries the page's data date — the same file the
#          page names in `update_from` in the portal. The loader reads the
#          date from it, so the database can say when the data about a
#          pathogen last moved. Pages without their own data have none.
dashboards:
  /dashboards/covid19-surveillance/:           { kind: surveillance, chart: covid_summary }
  /dashboards/covid-demographics/:             { kind: surveillance, chart: covid_by_vaccination }
  /dashboards/influenza-surveillance/:         { kind: surveillance, chart: flu_weekly }
  /dashboards/influenza-regional/:             { kind: surveillance, chart: flu_regional_weekly }
  /dashboards/influenza-intensity/:            { kind: surveillance, chart: flu_mem }
  /dashboards/infectious-diseases-childhood/:  { kind: surveillance, chart: isin_group_childhood_airborne }
  /dashboards/infectious-diseases-gastro/:     { kind: surveillance, chart: isin_group_gastrointestinal }
  /dashboards/infectious-diseases-hepatitis/:  { kind: surveillance, chart: isin_group_hepatitis }
  /dashboards/infectious-diseases-rare/:       { kind: surveillance, chart: isin_group_rare_severe }
  /dashboards/infectious-diseases-skin/:       { kind: surveillance, chart: isin_group_skin_contact }
  /dashboards/infectious-diseases-sti/:        { kind: surveillance, chart: isin_group_sti }
  /dashboards/infectious-diseases-tbc/:        { kind: surveillance, chart: tbc_incidence }
  /dashboards/infectious-diseases-vector/:     { kind: surveillance, chart: isin_group_vector_animal }
  /dashboards/genomics/:                       { kind: genomics, chart: genomics_overview }
  /dashboards/genomics-lineages/:              { kind: genomics, chart: genomics_lineages }
  /dashboards/genomics-amr/:                   { kind: genomics, chart: genomics_amr }
  /dashboards/ebola-bundibugyo-2026/:          { kind: report }
  /dashboards/hantavirus-mhondius/:            { kind: report }
  /dashboards/nextstrain-influenza/:           { kind: external }
  /dashboards/nextstrain-sarscov2/:            { kind: external }
  /dashboards/wastewater-monitoring/:          { kind: external }

# ICD-10 codes the records below refer to that are NOT in the code list of
# curated/labels_en.yaml (that list holds the codes present in the ISIN data).
# English = the WHO ICD-10 Version 2019 title, read from
# https://icd.who.int/browse10/2019/en on 2026-11-26. The Czech MKN-10 title is
# left out on purpose until somebody copies it from the official edition — our
# own translation would look official without being it.
