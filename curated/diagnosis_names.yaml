# Reader-facing names of diagnoses — Czech and English, keyed by ICD-10 code.
#
# Why it exists: ISIN names diagnoses by their ICD-10 heading. For a specialist
# that is the exact term; for a reader of the portal "Jiné spirochetové infekce"
# hides that nearly all of those cases are Lyme disease, and the weekly ÚZIS
# summary writes its names in capitals ("ENTERITIDA - CAMPYLOBACTER"). The
# overview blocks (scripts/compute_isin.py) show the name from this file and keep
# the official one next to it, so nothing is lost.
#
# Rules:
#   - A name must not narrow the code. A04 is "other bacterial intestinal
#     infections", of which Campylobacter is about two thirds — so the name says
#     "Campylobacter and others", not "campylobacteriosis". A04.5 alone is
#     campylobacteriosis.
#   - A code that is not listed keeps the official name (English from
#     labels_en.yaml). Add a name here only when the official one misleads or
#     is unreadable.
#   - Three-character codes are the open ISIN export, codes with a subcategory
#     (A04.5, A37.0, A69.2) are the weekly ÚZIS summary; the two are different
#     series even where the name is the same.

A02:   { cs: "Salmonelóza", en: "Salmonellosis" }
A04:   { cs: "Bakteriální střevní infekce (kampylobakter a další)", en: "Bacterial intestinal infections (Campylobacter and others)" }
A04.5: { cs: "Kampylobakterióza", en: "Campylobacteriosis" }
