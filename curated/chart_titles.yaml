# Titles of the generated chart JSON files — Czech and English.
#
# Why it exists: charts.yaml says WHAT a chart measures (metric, unit, grain) in
# a machine vocabulary; this file says what the file IS, in a sentence a person
# or a catalogue can show. Without it a reader of `flu_weekly.json` has only the
# file name. scripts/chart_meta.py writes the title into the `meta` block.
#
# Rules:
#   - A title has to stand on its own. The dashboard heading "Hospitalisations —
#     patient status" relies on the page being about COVID-19; here the disease
#     and the country are part of the title.
#   - No years and no season in a title ("2018–2025", "season 2025/26"). The
#     file is regenerated and the title is not, so a period written here goes
#     stale; the period is in `meta.period`. tests/test_source_metadata.py
#     rejects a four-digit year in a title.
#   - Wording follows the chart headings on the portal's dashboards; keep the
#     two in line when either changes.
#
# Keys are the chart names from charts.yaml. The thematic disease groups
# (`isin_group_*` there) are listed one by one, because one title cannot name
# eight groups.

