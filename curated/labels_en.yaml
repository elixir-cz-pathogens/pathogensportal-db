# English labels for the generated chart JSON (PPDB-77).
#
# The pipeline writes Czech labels; the English site used to translate them in
# the browser with a finite dictionary (pp-charts.js), so diagnosis names, age
# groups and region names stayed Czech. scripts/labels_en.py reads this file and
# adds optional `*_en` fields next to the Czech ones (labels_en, label_en,
# x_title_en, unit_en, x_unit_en; diagnoza_nazev_en / kraj_nazev_en in signals).
# The Czech fields stay as they are, so an older frontend keeps working.
#
# Translations are keyed by codes wherever the data has codes (ICD-10, NUTS3),
# so a reworded Czech name in the source does not silently drop the English one;
# tests/test_labels_en.py fails when a code in the data has no English name.
#
# Sources:
#   diagnoses – titles of the WHO ICD-10 Version 2019 classification
#               (https://icd.who.int/browse10/2019/en), © World Health
#               Organization; the Czech names are the ones ÚZIS publishes in
#               ISIN / the registries (MKN-10).
#   regions   – English names of the regions as used by the Czech Statistical
#               Office (ČSÚ) and the regions' own English sites.
#   terms     – our own translations of the fixed labels in generate_json.py and
#               friends; keep them in line with the English site's wording.

regions:
  # cs: every spelling the sources use; en: short form for chart labels and
  # maps; en_full: full name for tables (anomaly signals).
  CZ010: {cs: ["Hl. m. Praha", "Praha", "Hlavní město Praha"], en: "Prague", en_full: "Prague"}
