# Registr datových zdrojů — technická provenience.
#
# Proč existuje: pipeline stahuje data z deseti různých míst a dosud nikde
# nebylo zapsáno, KDE se o každém z nich dají zjistit metadata (kdo ho vydal,
# pod jakou licencí, kdy ho naposledy změnil). `source_metadata.py` podle
# tohohle registru metadata stáhne, `generate_json.py` je přibalí ke grafům
# a MCP/AI vrstva tak u každého čísla ví, odkud pochází a jak je staré.
#
# ⚠️ POZOR na záměnu se stejnojmenným souborem v portálu.
#   pathogensportal/frontend/data/sources.yaml = REDAKČNÍ popis pro čtenáře
#       (názvy cs/en, `limits` = co z dat nejde vyčíst, `grain`, `pages`).
#   tenhle soubor                              = TECHNICKÁ provenience
#       (kde leží metadata, co se stahuje, do jakých souborů to padá).
# Společné mají jen `id` a `publisher` — a ta se musí shodovat, protože přes
# `id` se obě strany spojují. Redakční texty sem nepatří a naopak; jinak
# vzniknou dvě pravdy o jednom zdroji a jedna z nich začne tiše zastarávat.
#
# Formát záznamu:
#   id          stabilní identifikátor, shodný s portálovým katalogem
#   publisher   vydavatel tak, jak se uvádí sám
#   landing     stránka pro člověka (ne soubor)
#   licence     name (+ url), psát tak, jak ji uvádí ZDROJ; když ji neuvádí,
#               napsat "neuvedena" — domyšlená licence je horší než mezera
#   files       cesty relativní k $DATA_DIR, které z tohohle zdroje vznikají;
#               přes ně se k metadatům dohledá datum snapshotu z raw/manifest.json
#   methodology id záznamů z methodology_changes.yaml, které se tohohle zdroje
#               týkají — odtud se plní `caveats` v metadatech grafu
#   discovery   jak zjistit metadata u vydavatele; klíče jsou nepovinné a
#               kombinovatelné, každý se zkouší samostatně:
#     csvw:       URL CSVW popisu (`*.csv-metadata.json`) — dc:title, dc:license,
#                 dc:modified, dc:publisher, seznam sloupců. Nejbohatší zdroj.
#     nkod:       IRI datové sady v Národním katalogu otevřených dat
#                 (data.gov.cz) — accrualPeriodicity, témata, trvalý odkaz
#     http_head:  URL, na které stačí HEAD — Last-Modified, ETag, velikost
#     github:     "owner/repo", datum posledního commitu přes GitHub API
#     manual:     ručně zjištěné datum poslední změny (YYYY-MM-DD) pro zdroje,
#                 které nezveřejňují nic strojového — vždy s `manual_note`,
#                 ať je poznat, že je to naše tvrzení, ne tvrzení zdroje
#
# Pořadí = česká surveillance nejdřív, pak mezinárodní kontext.

