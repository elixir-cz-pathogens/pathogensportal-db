- id: szu-respiratory
  publisher: "SZÚ — Národní referenční laboratoř pro chřipku"
  landing: "https://szu.gov.cz/publikace-szu/data/akutni-respiracni-infekce-chripka/"
  licence:
    name: "neuvedena — zveřejněné zprávy SZÚ, uvádíme zdroj"
  files: ["szu/szu_influenza_2025_2026.csv", "szu/szu_weekly_viry.csv", "szu/szu_weekly_kraje.csv"]
  methodology: ["szu-retro-korekce"]
  # SZÚ publishes weekly PDFs at changing URLs — there is no stable address to
  # send a HEAD to, and the release date can only be read from the PDF content
  # (szu_weekly.py). Freshness for this source therefore comes from the snapshot
  # date, not from the publisher.
  discovery:
    manual: "2026-09-24"
    manual_note: >-
      Zdroj nezveřejňuje strojová metadata ani stabilní URL souboru. Datum je
      poslední ověření, že stránka s týdenními zprávami žije, ne datum dat.

