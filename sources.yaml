  licence:
    name: "CC BY-NC-ND 4.0 (patička webu SZÚ)"
    url: "https://creativecommons.org/licenses/by-nc-nd/4.0/deed.cs"
    note: >-
      Patička webu szu.gov.cz: „© Státní zdravotní ústav 2023 - 2026,
      CC BY-NC-ND 4.0“. Stránka s daty jinou licenci ani podmínky neuvádí.
      Zda se licence webu vztahuje i na číselná data ve zprávách, ověřujeme
      u SZÚ.
    verified: "2026-10-25"
  files: ["szu/szu_influenza_2025_2026.csv", "szu/szu_weekly_viry.csv", "szu/szu_weekly_kraje.csv"]
  methodology: ["szu-retro-korekce"]
  # SZÚ publishes weekly PDFs at changing URLs — there is no stable address to
  # send a HEAD to, and the release date can only be read from the PDF content
  # (szu_weekly.py). Freshness for this source therefore comes from the snapshot
  # date, not from the publisher.
  discovery:
    manual: "2026-09-24"
    manual_note: >-
      Zdroj nezveřejňuje strojová metadata ani stabilní URL souboru. Datum je
      poslední ověření, že stránka s týdenními zprávami žije, ne datum dat.

- id: who-fluid-flunet
  publisher: "WHO"
  landing: "https://www.who.int/tools/flunet"
  licence:
    name: "WHO Terms and Conditions pro data — užití pro účely veřejného zdraví"
    url: "https://www.who.int/about/policies/publishing/data-policy/terms-and-conditions"
    note: >-
      Užití, šíření a zahrnutí do jiných produktů pro účely veřejného zdraví.
      Data neprodávat, nepoužívat jméno ani znak WHO, nenaznačovat, že WHO
      způsob užití podporuje. Úpravy nad rámec minimálního přizpůsobení
      (stylu tabulek a grafů) podmínky vážou na předchozí písemný souhlas WHO.
    verified: "2026-10-25"
  # The terms prescribe the attribution format: "WHO, title of dataset, year,
  # date of access, acknowledgement of the country or countries having provided
  # the underlying data". The date of access is the snapshot date.
  citation: >-
    WHO, FluNet a FluID, 2026, [datum stažení]; podkladová data poskytla Česká republika.
  files: ["who/who_flunet_cz.csv", "who/who_fluid_cz.csv"]
  methodology: ["flunet-jmenovatel-2021", "lab-nulove-tydny-2025-05"]
  discovery:
    http_head: "https://xmart-api-public.who.int/FLUMART/VIW_FNT?$top=1&$filter=COUNTRY_CODE%20eq%20%27CZE%27"

