- id: ecdc-covid
  publisher: "ECDC"
  landing: "https://www.ecdc.europa.eu/en/covid-19/data"
  licence:
    name: "ECDC — volné použití s uvedením zdroje"
  files: ["ecdc/ecdc_covid_cz.csv"]
  methodology: []
  # Closed series — the source stopped publishing in October 2022. `manual` is
  # here so that nobody tries to discover freshness for something that will
  # never move again.
  discovery:
    manual: "2022-10-01"
    manual_note: "Zdroj přestal datovou sadu aktualizovat; držíme ji jen kvůli historii."
