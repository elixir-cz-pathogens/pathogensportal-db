# Data source registry — technical provenance.
#
# Why it exists: the pipeline downloads data from ten different places, and
# until now nothing recorded WHERE the metadata of each one can be found (who
# published it, under which licence, when it last changed). `source_metadata.py`
# fetches the metadata according to this registry, `generate_json.py` attaches
# it to the charts, and the MCP/AI layer therefore knows where every number
# comes from and how old it is.
#
# ⚠️ Do NOT confuse this with the file of the same name in the portal.
#   pathogensportal/frontend/data/sources.yaml = EDITORIAL description for readers
#       (cs/en titles, `limits` = what the data cannot tell you, `grain`, `pages`).
#   this file                                  = TECHNICAL provenance
#       (where the metadata lives, what is downloaded, which files it lands in).
# The two share only `id` and `publisher` — and those must match, because `id`
# is the join key between both sides. Editorial text does not belong here and
# vice versa; otherwise there are two truths about one source and one of them
# quietly goes stale.
#
# Record format:
#   id          stable identifier, identical to the portal's catalogue
#   publisher   the publisher, named the way it names itself
#   landing     page for a human (not a file)
#   licence     name (+ url), written the way the SOURCE states it; when the
#               source states none, write "neuvedena" (not stated) — an
#               invented licence is worse than a gap. `note` = conditions of
#               use that the name alone does not carry, or where sources
#               contradict each other; `verified` = the day somebody read the
#               terms on the page linked in `url`
#   citation    the citation / attribution sentence the source asks for,
#               copied verbatim (optional — only when the source gives one)
#   files       paths relative to $DATA_DIR that this source produces; they are
#               used to look up the snapshot date in raw/manifest.json
#   methodology ids of records in methodology_changes.yaml that concern this
#               source — this is what fills `caveats` in the chart metadata
#   discovery   how to find the metadata at the publisher; every key is optional
#               and they can be combined, each one is tried independently:
#     csvw:       URL of the CSVW description (`*.csv-metadata.json`) — dc:title,
#                 dc:license, dc:modified, dc:publisher, column list. The richest.
#     nkod:       IRI of the dataset in the Czech National Open Data Catalogue
#                 (data.gov.cz) — accrualPeriodicity, themes, permanent link
#     http_head:  URL that answers a HEAD request — Last-Modified, ETag, size
#     github:     "owner/repo", date of the last commit through the GitHub API
#     manual:     hand-checked date of the last change (YYYY-MM-DD) for sources
#                 that publish nothing machine-readable — always together with
#                 `manual_note`, so it is clear that the claim is ours, not the
#                 source's
#
# Order = Czech surveillance first, international context after.

