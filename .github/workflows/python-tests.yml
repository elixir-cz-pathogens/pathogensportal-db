name: "CI: Tests"

# Runs the unit tests (pytest) on every push and PR — immediate feedback.
# It is tolerant: while there are no tests it passes (it does not block a fresh repo).
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          [ -f requirements.txt ] && pip install -r requirements.txt || true
          pip install pytest

      - name: Run pytest
        run: |
          set +e
          pytest -q
          code=$?
          # pytest exit 5 = no tests collected yet = fine for a fresh repo
          if [ "$code" -eq 5 ]; then echo "no tests yet — OK"; exit 0; fi
          exit $code
