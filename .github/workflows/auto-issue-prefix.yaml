name: "AUTOMATION: Issue Prefixer"

# When an issue is opened, renames its title to "<PREFIX>-<number>: original title".
# The prefix comes from the PROJECT_PREFIX repo variable, "PPDB" by default.
on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  add-prefix:
    runs-on: ubuntu-latest
    steps:
      - name: Prefix issue title
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prefix = "${{ vars.PROJECT_PREFIX || 'PPDB' }}";
            const issueNumber = context.issue.number;
            const originalTitle = context.payload.issue.title;
            const expectedPrefix = `${prefix}-${issueNumber}`;
            if (!originalTitle.startsWith(expectedPrefix)) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                title: `${expectedPrefix}: ${originalTitle}`
              });
            }
