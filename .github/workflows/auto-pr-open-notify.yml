name: "AUTOMATION: PR Open Notification"

# When a PR is opened, comments on the matching issue (the number is taken from the PR title).
on:
  pull_request:
    types: [opened]

permissions:
  issues: write
  pull-requests: read

jobs:
  comment-on-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Comment PR opened on issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            // ⚠️ The issue number is matched by PROJECT_PREFIX, not by `\w+`.
            // The original `/(\w+-\d+)/` had neither an anchor nor a prefix
            // restriction, so any word-number pair in the title looked like an
            // issue reference. A date in the title (e.g. "... pro 2026-09-04") was
            // read as `2026-09`, and `.split('-')[1]` turned that into issue #9 —
            // where the bot then posted a comment. The victim also changes with
            // the month: in December it would have been #12.
            const prefix = "${{ vars.PROJECT_PREFIX || 'PPDB' }}";
            const match = pr.title.match(new RegExp(`\\b${prefix}-(\\d+)\\b`));
            if (match) {
              const issueNumber = match[1];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `PR [#${pr.number}](${pr.html_url}) opened from branch \`${pr.head.ref}\`.`
              });
            } else {
              console.log("No issue number in PR title — skipping.");
            }
