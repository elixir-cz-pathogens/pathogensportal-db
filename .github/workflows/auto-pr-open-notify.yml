name: "AUTOMATION: PR Open Notification"

# Při otevření PR napíše komentář do odpovídajícího issue (číslo bere z titulku PR).
on:
  pull_request:
    types: [opened]

permissions:
  issues: write
  pull-requests: read

jobs:
  comment-on-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Comment PR opened on issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            // ⚠️ Číslo issue se hledá podle PROJECT_PREFIX, ne podle `\w+`.
            // Původní `/(\w+-\d+)/` nemělo kotvu ani omezení na prefix, takže
            // jakákoliv dvojice slovo-číslo v titulku vypadala jako odkaz na issue.
            // Datum v titulku (např. "... pro 2026-09-04") se vyložilo jako `2026-09`
            // a `.split('-')[1]` z toho udělal issue #9 — do kterého pak bot napsal
            // komentář. Oběť se navíc mění s měsícem: v prosinci by to bylo #12.
            const prefix = "${{ vars.PROJECT_PREFIX || 'PPDB' }}";
            const match = pr.title.match(new RegExp(`\\b${prefix}-(\\d+)\\b`));
            if (match) {
              const issueNumber = match[1];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `PR [#${pr.number}](${pr.html_url}) opened from branch \`${pr.head.ref}\`.`
              });
            } else {
              console.log("No issue number in PR title — skipping.");
            }
